apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-practice-deploy-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-practice-backend
  template:
    metadata:
      labels:
        app: my-practice-backend
    spec:
      containers:
        - name: my-practice-backend
          image: kartavyanirwel/task-backend:v1
          imagePullPolicy: Always
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: APP_ENV
              value: "k8s"
            - name: CORS_ORIGIN
              value: "http://localhost:5173"
            - name: DB_HOST
              value: my-practice-db
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: tasktracker
            - name: DB_USER
              value: tasks
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-practice-db-secret
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 8080
              protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-practice-deploy-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-practice-frontend
  template:
    metadata:
      labels:
        app: my-practice-frontend
    spec:
      containers:
      - name: my-practice-frontend
        image: kartavyanirwel/task-frontend:v1
        imagePullPolicy: Always
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 128Mi
            cpu: 500m
        ports:
        - containerPort: 80
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: my-practice-backend-service
spec:
  selector:
    app: my-practice-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: my-practice-frontend-service
spec:
  selector:
    app: my-practice-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
